# Drafted with `wol-port new`, finished by hand.
id = "com.github.finefindus.eyedropper"
package = "eyedropper"
version = "2.2.1"
name = "Eyedropper"
summary = "Pick and format colors"
license = "GPL-3.0"
homepage = "https://github.com/FineFindus/eyedropper"
categories = ["Develop"]
capabilities = ["screen-capture"]
icon = "com.github.finefindus.eyedropper"
entry = "bin/eyedropper"

[source]
git = "https://github.com/FineFindus/eyedropper.git"
tag = "v2.2.1"

[build]
system = "meson"

[deps]
build = ["AppStream", "blueprint-compiler", "desktop-file-utils", "gettext-tools", "rust"]
run = ["glib", "gtk4", "libadwaita"]


# Drafted with `wol-port new`, finished by hand.
id = "com.github.ADBeveridge.Raider"
package = "raider"
version = "3.1.0"
name = "File Shredder"
summary = "Permanently delete your files"
license = "GPL-3.0-or-later"
homepage = "https://github.com/ADBeveridge/raider"
categories = ["Work"]
capabilities = ["files"]
icon = "com.github.ADBeveridge.Raider"
entry = "bin/raider"

[source]
git = "https://github.com/ADBeveridge/raider.git"
tag = "v3.1.0"

[build]
system = "meson"

[deps]
build = ["AppStream", "blueprint-compiler", "desktop-file-utils", "gettext-tools"]
run = ["glib", "gtk4", "libadwaita"]


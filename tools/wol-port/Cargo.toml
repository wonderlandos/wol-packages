[package]
name = "wol-port"
version = "0.1.0"
edition = "2024"
license = "BSD-2-Clause"
authors = ["Julia Klee"]
description = "Draft, build, pack, sign and index .wol packages"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
sha2 = "0.10"
